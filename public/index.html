<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Smart Sprout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
        <img src="assets/smartsproutlogo.png" alt="Smart Sprout Logo">

        <div id="loginView">
            <div class="input-group">
                <h3>Logowanie / Rejestracja</h3>
                <input type="text" id="username" placeholder="Login">
                <input type="password" id="password" placeholder="Hasło">
                
                <button onclick="auth('login')">Zaloguj</button>
                <button onclick="auth('register')" class="btn-secondary">Zarejestruj</button>
            </div>
        </div>

    </div>

    <div id="appView" style="display:none;">
        
        <div class="header-bar">
            <div>
                Zalogowano jako: <b id="currentUser">...</b> 
                (<span id="currentRole">...</span>)
            </div>
            <button onclick="logout()" class="btn-danger">Wyloguj</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <h3>Panel Administratora</h3>
            <p>Kliknij na użytkownika, aby zobaczyć jego rośliny.</p>
            
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Login</th>
                        <th>Akcja</th>
                    </tr>
                </thead>
                <tbody id="usersListBody">
                    </tbody>
            </table>
            <div id="adminMessage"></div>
        </div>

        <div id="userPanel" class="input-group">
            <input type="text" id="plantName" placeholder="Nazwa rośliny...">
            <button class="add-plant-btn" onclick="addPlant()">Dodaj Roślinę</button>
        </div>

        <div id="plantsList">Ładowanie...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Smart Sprout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="header-container">

        <img src="assets/smartsproutlogo.png" alt="Smart Sprout Logo">

        <div id="loginView">
            <div class="input-group">
                <h3>Logowanie / Rejestracja</h3>
                <input type="text" id="username" placeholder="Login">
                <input type="password" id="password" placeholder="Hasło">
                
                <button onclick="auth('login')">Zaloguj</button>
                <button onclick="auth('register')" class="btn-secondary">Zarejestruj</button>
            </div>
        </div>

    </div>

    <div id="appView" style="display:none;">
        
        <div class="header-bar">
            <div>
                Zalogowano jako: <b id="currentUser">...</b> 
                (<span id="currentRole">...</span>)
            </div>
            <button onclick="logout()" class="btn-danger">Wyloguj</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h3>Panel Administratora</h3>
                <p>Kliknij na użytkownika, aby zobaczyć jego rośliny.</p>
            </div>
            
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Login</th>
                        <th>Akcja</th>
                    </tr>
                </thead>
                <tbody id="usersListBody">
                    </tbody>
            </table>
            <div id="adminMessage"></div>
        </div>

        <div id="userPanel" class="input-group">
            <input type="text" id="plantName" placeholder="Nazwa rośliny...">
            <button class="add-plant-btn" onclick="addPlant()">Dodaj roślinę</button>
        </div>

        <!-- wyszukiwarka -->
        <div class="search-bar-container" style="margin: 15px 0; display:none;" id="plantSearchContainer">
            <input type="text" 
                id="searchPlantInput" 
                placeholder="Wyszukaj roślinę..." 
                onkeyup="searchPlants()" 
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <!-- lista roslin -->
        <div id="plantsList">Ładowanie...</div>

        <!-- logi  -->
        <div class="logs-container">
                <div class="logs-header">
                    <h3>Historia działań</h3>
                    <button onclick="loadLogs()" class="btn-refresh" title="Odśwież logi">&#x21bb;</button>
                </div>
                
                <div id="systemLogs">
                    Brak ostatnich działań.
                </div>
        </div>
    </div>

    <!-- przycisk czatu -->
    <div id="chatButton" onclick="toggleChat()" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="#ffffff" d="M64 416L64 192C64 139 107 96 160 96L480 96C533 96 576 139 576 192L576 416C576 469 533 512 480 512L360 512C354.8 512 349.8 513.7 345.6 516.8L230.4 603.2C226.2 606.3 221.2 608 216 608C202.7 608 192 597.3 192 584L192 512L160 512C107 512 64 469 64 416z"/></svg>
    </div>

    <!-- okienko czatu -->
    <div id="chatWindow" style="display:none;">
        <div class="chat-header">
            <span id="chatTitle">Czat</span>
            <button class="chat-close-btn" onclick="toggleChat()">×</button>
        </div>
        
        <div class="chat-body" style="display: flex; flex: 1; min-height: 0;">
            
            <div id="adminUserList" style="display:none; width: 120px; background: #eee; border-right: 1px solid #ddd; overflow-y: auto;">
                </div>

            <div style="flex: 1; display: flex; flex-direction: column;">
                <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 10px;"></div>

                <div class="chat-input-area">
                    <input type="hidden" id="targetUserId">
                    <input type="text" id="chatInput" placeholder="Napisz wiadomość...">
                    <button onclick="sendMessage()" class="chat-send-btn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- nowe funkcjonalnosci - ustawienie alarmu dla danej wilgotonosci, usuniecie wszystkich logow rosliny -->
    <div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeSettingsModal()">&times;</span>
        <h2 id="modalPlantName">Ustawienia</h2>
        
        <div class="setting-group">
            <label>Włącz alarm gdy wilgotność spadnie poniżej (%):</label>
            <input type="number" id="modalMinHumidity" min="0" max="100">
            <button onclick="savePlantSettings()" class="btn-save">Zapisz zmiany</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <div class="setting-group">
            <label style="color: #d32f2f;">Wyczyść historię logów:</label>
            <p style="font-size: 12px; color: #666;">Jeśli historia zajmuje za dużo miejsca, możesz ją wyczyścić.</p>
            <button onclick="clearPlantLogs()" class="btn-danger">Wyczyść</button>
        </div>
    </div>
</div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
